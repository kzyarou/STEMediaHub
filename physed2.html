<!DOCTYPE html>
<html>
  <head>
    <title>Physical Education</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+HU:wght@100..400&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/control-panel.css" />
    <link rel="stylesheet" href="css/physed2.css" />
    <style>
      .hero-section {
        background: linear-gradient(135deg, #4d1d69 0%, #2d0f3d 100%);
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 4rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
        transform: none !important;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .hero-section h1 {
        font-size: 3.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      .hero-section p {
        font-size: 1.5rem;
        font-weight: 500;
        color: #ffffff;
        opacity: 0.95;
      }

      .hero-section::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          rgba(77, 29, 105, 0.2) 0%,
          rgba(45, 15, 61, 0.2) 100%
        );
        animation: gradientShift 8s ease infinite;
      }

      @keyframes gradientShift {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .lesson-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
      }

      .quarter-section {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        margin: 2rem auto;
        max-width: 1400px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        transition: transform 0.3s ease-out;
      }

      .quarter-section:hover {
        transform: translateY(-5px);
      }

      .lesson-btn {
        background: white;
        border: 2px solid #4d1d69;
        color: #4d1d69;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        font-weight: 700;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60px;
        position: relative;
        overflow: hidden;
        text-decoration: none;
      }

      .lesson-btn:hover {
        background: #4d1d69;
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(77, 29, 105, 0.3);
      }

      .lesson-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(77, 29, 105, 0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s ease-out, height 0.6s ease-out;
      }

      .lesson-btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .quarter-title {
        color: #4d1d69;
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 2rem;
        text-align: center;
        position: relative;
        transition: color 0.3s ease;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }

      .quarter-title::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: #4d1d69;
        margin: 1rem auto;
        border-radius: 2px;
      }

      .quarter-title:hover {
        color: #2d0f3d;
      }

      /* Animation Classes */
      .fade-in {
        opacity: 1;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .slide-in-left {
        opacity: 1;
        transform: translateX(-50px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .slide-in-left.visible {
        opacity: 1;
        transform: translateX(0);
      }

      .slide-in-right {
        opacity: 1;
        transform: translateX(50px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .slide-in-right.visible {
        opacity: 1;
        transform: translateX(0);
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <header
      class="flex justify-between items-center bg-[#4D1D69] text-white p-4"
    >
      <h1 class="text-2xl font-bold tracking-wide text-white drop-shadow-lg">
        STEMediaHub
      </h1>

      <!-- Menu Button -->
      <button
        id="menuButton"
        class="bg-[#4D1D69] px-4 py-2 rounded flex items-center gap-2 hover:bg-[#5D2D79] transition-colors"
      >
        <svg
          id="menuIcon"
          class="w-6 h-6 transition-transform duration-300"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Sidebar Menu -->
    <div
      id="sidebarMenu"
      class="fixed top-0 left-0 h-full w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300"
    >
      <div class="p-4 bg-blue-500 text-white flex justify-between items-center">
        <h2 class="text-lg font-bold">Control Panel</h2>
        <button id="closeButton" class="text-xl">&times;</button>
      </div>
      <nav class="p-4">
        <a
          href="index.html"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-200 rounded"
        >
          <svg
            class="sidebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path d="M9 22V12h6v10" />
          </svg>
          Homepage
        </a>
        <a
          href="misc/comingsoon.html"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-200 rounded"
        >
          <svg
            class="sidebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            />
          </svg>
          Quizzes
        </a>
        <a
          href="misc/comingsoon.html"
          class="block px-4 py-2 text-gray-700 hover:bg-gray-200 rounded"
        >
          <svg
            class="sidebar-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
          Modules
        </a>
        <hr class="my-2" />
      </nav>
    </div>

    <script>
      const menuButton = document.getElementById("menuButton");
      const menuIcon = document.getElementById("menuIcon");
      const sidebarMenu = document.getElementById("sidebarMenu");
      const closeButton = document.getElementById("closeButton");

      menuButton.addEventListener("click", function () {
        sidebarMenu.classList.toggle("-translate-x-full");
        menuIcon.classList.toggle("rotate-90");
      });

      closeButton.addEventListener("click", function () {
        sidebarMenu.classList.add("-translate-x-full");
        menuIcon.classList.remove("rotate-90");
      });

      document.addEventListener("click", function (event) {
        if (
          !sidebarMenu.contains(event.target) &&
          !menuButton.contains(event.target)
        ) {
          sidebarMenu.classList.add("-translate-x-full");
          menuIcon.classList.remove("rotate-90");
        }
      });
    </script>

    <main>
      <section class="hero-section">
        <h1>Welcome to <br />Physical Education!</h1>
        <p>DNHS</p>
      </section>

      <div class="lesson-grid">
        <a href="#" class="lesson-btn">Lesson 1</a>
        <a href="#" class="lesson-btn">Lesson 2</a>
        <a href="#" class="lesson-btn">Lesson 3</a>
        <a href="#" class="lesson-btn">Lesson 4</a>
        <a href="#" class="lesson-btn">Lesson 5</a>
        <a href="#" class="lesson-btn">Lesson 6</a>
        <a href="#" class="lesson-btn">Lesson 7</a>
        <a href="#" class="lesson-btn">Lesson 8</a>
      </div>
    </main>
  </body>
</html>
