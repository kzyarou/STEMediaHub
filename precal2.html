    <style>
      .hero-section {
        background: linear-gradient(135deg, #1d8d41 0%, #156b2f 100%);
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 4rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
        transform: none !important;
      }

      .hero-section::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          rgba(29, 141, 65, 0.2) 0%,
          rgba(21, 107, 47, 0.2) 100%
        );
        animation: gradientShift 8s ease infinite;
      }

      @keyframes gradientShift {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .lesson-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
      }

      .quarter-section {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        margin: 2rem auto;
        max-width: 1400px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        transition: transform 0.3s ease-out;
      }

      .quarter-section:hover {
        transform: translateY(-5px);
      }

      .lesson-btn {
        background: white;
        border: 2px solid #1d8d41;
        color: #1d8d41;
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60px;
        position: relative;
        overflow: hidden;
      }

      .lesson-btn:hover {
        background: #1d8d41;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(29, 141, 65, 0.2);
      }

      .lesson-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(29, 141, 65, 0.1);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s ease-out, height 0.6s ease-out;
      }

      .lesson-btn:hover::before {
        width: 300px;
        height: 300px;
      }

      .quarter-title {
        color: #1d8d41;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
        position: relative;
        transition: color 0.3s ease;
      }

      .quarter-title::after {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: #1d8d41;
        margin: 1rem auto;
        border-radius: 2px;
      }

      .quarter-title:hover {
        color: #156b2f;
      }

      /* Animation Classes */
      .fade-in {
        opacity: 1;
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .slide-in-left {
        opacity: 1;
        transform: translateX(-50px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .slide-in-left.visible {
        opacity: 1;
        transform: translateX(0);
      }

      .slide-in-right {
        opacity: 1;
        transform: translateX(50px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }

      .slide-in-right.visible {
        opacity: 1;
        transform: translateX(0);
      }
    </style>

    <script>
      const menuButton = document.getElementById("menuButton");
      const menuIcon = document.getElementById("menuIcon");
      const sidebarMenu = document.getElementById("sidebarMenu");
      const closeButton = document.getElementById("closeButton");

      menuButton.addEventListener("click", function () {
        sidebarMenu.classList.toggle("-translate-x-full");
        menuIcon.classList.toggle("rotate-90");
      });

      closeButton.addEventListener("click", function () {
        sidebarMenu.classList.add("-translate-x-full");
        menuIcon.classList.remove("rotate-90");
      });

      document.addEventListener("click", function (event) {
        if (
          !sidebarMenu.contains(event.target) &&
          !menuButton.contains(event.target)
        ) {
          sidebarMenu.classList.add("-translate-x-full");
          menuIcon.classList.remove("rotate-90");
        }
      });
    </script>
