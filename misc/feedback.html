<!DOCTYPE html>
<html>
  <head>
    <title>Feedback - STEMediaHub</title>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="../css/stylesheet.css" />
    <link rel="stylesheet" href="../css/control-panel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .feedback-form {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #374151;
      }
      .form-input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
      }
      .form-textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        min-height: 150px;
        resize: vertical;
      }
      .submit-btn {
        background-color: #2563eb;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .submit-btn:hover {
        background-color: #1d4ed8;
      }
      .success-message {
        display: none;
        padding: 1rem;
        background-color: #dcfce7;
        color: #166534;
        border-radius: 6px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <header
      class="flex justify-between items-center bg-blue-600 text-white p-4"
    >
      <h1 class="text-xl font-bold">STEMediaHub</h1>
      <a href="../index.html" class="bg-blue-500 px-4 py-2 rounded"
        >Back to Home</a
      >
    </header>

    <main class="container mx-auto px-4 py-8">
      <div class="feedback-form">
        <h2 class="text-2xl font-bold mb-6 text-center">Provide Feedback</h2>
        <form
          action="https://formspree.io/f/YOUR_FORMSPREE_ID"
          method="POST"
          id="feedbackForm"
        >
          <div class="form-group">
            <label class="form-label" for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-input"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="subject">Subject:</label>
            <select id="subject" name="subject" class="form-input" required>
              <option value="">Select a subject</option>
              <option value="Earth Science">Earth Science</option>
              <option value="Oral Communication">Oral Communication</option>
              <option value="Pre Calculus">Pre Calculus</option>
              <option value="Physical Education">Physical Education</option>
              <option value="General Mathematics">General Mathematics</option>
              <option value="Personal Development">Personal Development</option>
              <option value="21st Century Literature">
                21st Century Literature
              </option>
              <option value="Komunikasyon at Pananaliksik">
                Komunikasyon at Pananaliksik
              </option>
              <option value="Empowerment Technology">
                Empowerment Technology
              </option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="feedback">Your Feedback:</label>
            <textarea
              id="feedback"
              name="feedback"
              class="form-textarea"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn w-full">
            Submit Feedback
          </button>
        </form>
        <div id="successMessage" class="success-message">
          Thank you for your feedback! We'll review it shortly.
        </div>
      </div>
    </main>

    <script>
      document
        .getElementById("feedbackForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form data
          const formData = new FormData(this);

          // Send form data to Formspree
          fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
              Accept: "application/json",
            },
          })
            .then((response) => {
              if (response.ok) {
                // Show success message
                document.getElementById("successMessage").style.display =
                  "block";
                // Reset form
                this.reset();
              } else {
                throw new Error("Network response was not ok");
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              alert(
                "There was a problem submitting your feedback. Please try again."
              );
            });
        });
    </script>
  </body>
</html>
